name: New language
description: Offer to translate Duydaş into a new language.
labels: ["area: i18n", "new-language", "status: triage"]
body:
  - type: input
    id: language
    attributes:
      label: Language and BCP 47 tag
      placeholder: e.g. Deutsch (de-DE)
    validations:
      required: true
  - type: checkboxes
    id: commitment
    attributes:
      label: Before you start
      options:
        - label: I have read docs/i18n-guide.md
          required: true
        - label: I am a fluent speaker of this language
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Script, plural rules, text direction or font needs we should know about.
