version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      icu4x:
        patterns: ["icu*"]
      fluent:
        patterns: ["fluent*", "unic-langid"]
      iced:
        patterns: ["iced*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
