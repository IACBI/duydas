[workspace]
resolver = "3"
members = [
    "crates/duydas-core",
    "crates/duydas-proto",
    "crates/duydas-i18n",
    "crates/duydas-client",
    "crates/duydas-voice",
    "crates/duydas-ui",
    "crates/duydas-sys",
    "crates/duydas-render",
    "apps/duydas-desktop",
    "apps/duydas-server",
    "xtask",
    "spikes/virtual-list",
]
default-members = ["apps/duydas-desktop"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["A.C.B"]
repository = "https://github.com/IACBI/duydas"
publish = false

[workspace.dependencies]
duydas-proto = { path = "crates/duydas-proto" }
duydas-i18n = { path = "crates/duydas-i18n" }
duydas-ui = { path = "crates/duydas-ui" }
duydas-sys = { path = "crates/duydas-sys" }
duydas-render = { path = "crates/duydas-render" }

# Iced stays until the in-house toolkit replaces it (ADR 0021).
# Defaults minus `web-colors` (intentionally wrong sRGB blending) and `crisp` (can jitter), plus
# advanced text shaping for Turkish/Japanese and the tokio executor the client SDK runs on.
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "x11",
    "wayland",
    "linux-theme-detection",
    "advanced-shaping",
    "tokio",
    "advanced",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
