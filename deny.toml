# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities fail for every crate. "Unmaintained" notices fail only for our direct
# dependencies: the current ones (paste, ttf-parser, zbus internals) come through Iced, and we
# can't replace them. Revisit on each Iced upgrade.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses compatible with distributing Duydaş under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
