[files]
# Translations and lockfiles are not English prose.
extend-exclude = [
    "locales/",
    "Cargo.lock",
    "*.svg",
    "spikes/*/src/corpus.rs",
    "crates/duydas-render/examples/scroll/corpus.rs",
    # Generated from the Unicode Character Database: code points and property values.
    "crates/duydas-text/src/tables.rs",
    "crates/duydas-text/tests/data/",
]

[default.extend-words]
# Turkish words in the README's Türkçe section that resemble English typos.
sistem = "sistem"
# Win32 SDK names (TME_LEAVE, a TrackMouseEvent flag).
tme = "tme"
# UAX #14 line break class BA (break after).
ba = "ba"
# General_Category Nd (decimal number).
nd = "nd"
# OpenType table that indexes glyph data (`loca`).
loca = "loca"
